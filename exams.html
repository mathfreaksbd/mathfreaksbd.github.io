<style>
:root{--paper:#eef3f8;--ink:#14233b;--grid:#cfdceb;--gold:#ffb400;--teal:#0e8a7d;--white:#fff}
[data-theme="dark"]{--paper:#0c1424;--ink:#e8eef7;--grid:#1c2943;--white:#16213a}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',sans-serif;color:var(--ink);line-height:1.7;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
h1,h3{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;line-height:1.2;margin:0 0 .5em}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px;flex-wrap:wrap}
a{color:var(--teal);font-weight:600}
.top button{font:inherit;font-weight:600;background:var(--white);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:20px}
.tag{display:inline-block;background:var(--gold);color:#14233b;padding:0 10px;border-radius:99px;font-size:.85rem;font-weight:600;margin-bottom:6px}
.meta{font-size:.9rem;font-weight:600;background:var(--paper);border-radius:6px;padding:4px 10px;display:inline-block;margin:0 0 10px}
.start{font:inherit;font-weight:700;background:var(--gold);color:#14233b;border:0;border-radius:6px;padding:8px 16px;cursor:pointer}
.card.soon{opacity:.65}
.start:disabled{background:var(--paper);color:var(--ink);border:2px dashed var(--ink);cursor:not-allowed}
.view{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
.view[hidden]{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;background:var(--ink);color:var(--paper)}
.bar a{color:var(--gold);margin-right:12px}
.bar button{font-size:1.3rem;line-height:1;width:36px;height:36px;border-radius:8px;border:2px solid var(--paper);background:transparent;color:var(--paper);cursor:pointer}
.view iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>

$('list').addEventListener('click',function(e){var b=e.target.closest('.start');if(b)openE(+b.getAttribute('data-i'))});

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('view').hidden)closeE()});
